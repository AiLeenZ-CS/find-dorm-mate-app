# 🚀 ลดลงจาก -Xmx8G -XX:MaxMetaspaceSize=4G เดิม (จองเยอะเกินจนเครื่องนี้เปิด daemon ไม่ได้เลย)
# แต่ 1536M ก็น้อยไปหน่อย — พอถึงขั้นตอน Jetifier แปลง io.flutter:x86_debug.jar แล้ว heap หมด
# 3072M คือจุดที่พอสำหรับ Kotlin compile + Jetifier ของโปรเจกต์นี้ (มี Firebase/Google Maps/
# ปลั๊กอินหลายตัว) โดยไม่จองมากจนเครื่องที่ RAM เหลือจำกัดเปิด daemon ไม่ขึ้นเหมือนค่าเดิม
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 🚀 ลด RAM ที่ Gradle/Kotlin ค้างไว้เฉยๆ บนเครื่องนี้ (เจอปัญหาซ้ำหลายรอบว่า java.exe
# ของ Gradle/Kotlin daemon ค้างอยู่หลายตัวพร้อมกันจนแรมหมด):
# 1) จำกัด heap ของ Kotlin daemon แยกจาก Gradle daemon (ไม่งั้น default จะกะขนาดจาก
#    RAM ทั้งเครื่อง ซึ่งอาจโตเกินความจำเป็นสำหรับโปรเจกต์นี้)
kotlin.daemon.jvm.options=-Xmx1g
# 2) ถ้าแก้ไฟล์นี้บ่อยๆ (เช่นตอน debug ปัญหา build) daemon ตัวเก่าจะไม่ตรง fingerprint แล้ว
#    แต่ยังไม่ตายทันที (ปกติรอ idle 3 ชม.) ลดเวลานี้ลงเหลือ 10 นาที กันมันค้างกิน RAM นาน
org.gradle.daemon.idletimeout=600000
# 3) จำกัดจำนวน worker process พร้อมกัน ลด peak memory ตอน build ในเครื่องที่ RAM จำกัด
org.gradle.workers.max=2
